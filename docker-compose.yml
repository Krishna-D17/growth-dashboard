services:
  postgres:
    image: postgres:16-alpine
    container_name: socialscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialscope
      POSTGRES_USER: socialscope
      POSTGRES_PASSWORD: socialscope
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialscope -d socialscope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
